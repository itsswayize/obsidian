<app-header></app-header>

<app-footer></app-footer>

@if (showBackToTop) {
  <button
    type="button"
    class="back-to-top"
    aria-label="Back to top"
    title="Back to top"
    (click)="scrollToTop()"
  >
    <span aria-hidden="true">&#8593;</span>
  </button>
}
