<div class="row g-4">
  @if (services$ | async; as services) {
    @for (service of services; track service.id) {
      <div class="col-md-6">
        <div
          class="premium-card h-100 d-flex flex-column cursor-pointer"
          [ngClass]="{ 'border-accent': selectedServiceId === service.id }"
          (click)="onSelect(service)"
        >
          <div class="d-flex justify-content-between align-items-start mb-2">
            <h4 class="h6 mb-0">{{ service.name }}</h4>
            <span class="text-accent fw-bold">R{{ service.price }}</span>
          </div>
          <p class="text-secondary small flex-grow-1">{{ service.description }}</p>
          <div class="mt-3 pt-2 text-end" style="border-top: 1px solid var(--border-color)">
            <span class="small text-secondary">{{ service.durationMinutes }} mins</span>
          </div>
        </div>
      </div>
    }
  }
</div>
